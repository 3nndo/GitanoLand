<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>GitanoLand</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- efecto "liquid glass": filtro de refraccion que se usa en backdrop-filter (ver .glass en style.css) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <filter id="liquid" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.010 0.016" numOctaves="2" seed="11" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2.5" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="26" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs></svg>
  <div id="bg"><div class="aurora"><i></i><i></i><i></i><i></i></div></div>
  <div id="titlebar" class="glass">
    <div class="drag pywebview-drag-region"><img class="logo" src="img/logo.png" alt=""><span class="ver" id="ver"></span></div>
    <button class="wbtn glow" id="gear" aria-label="Opciones" style="display:none"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h0a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v0a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.03z"/></svg></button>
    <div id="geartip" role="tooltip"><span>Personaliza tu experiencia</span><button id="gearok" type="button">OK</button></div>
    <button class="wbtn" id="min" title="Minimizar">&#8212;</button>
    <button class="wbtn close" id="close" title="Cerrar">&#10005;</button>
  </div>
  <div id="view"></div>
  <div id="modal"></div>
  <div id="toast"></div>
  <script>
    // modo prueba en el navegador (sin Python): index.html?mock
    if (location.search.includes("mock")) {
      window.__MOCK__ = true;
      document.write('<script src="mock.js"><\/script>');
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
